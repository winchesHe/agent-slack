# 定时任务（scheduledTasks）配置示例。
# 复制到你的 workspace: .agent-slack/scheduled-tasks.yaml
# 文件缺失时功能关闭；保存后需要重启 agent-slack daemon。

version: 1
enabled: false   # 启用：改为 true

tasks:
  - id: daily-standup
    enabled: false   # 启用：改为 true
    description: 示例：工作日早上 9 点总结仓库变更并发到 Slack 频道。
    cron: '0 9 * * 1-5'
    # timezone: 'Asia/Shanghai'   # 可选；默认本机时区
    prompt: |
      请总结最近 24 小时仓库的关键变更，列 3-5 条要点。
    target:
      im: slack
      channelId: C0123456789

  - id: weekly-report
    enabled: false   # 启用：改为 true
    description: |
      示例：每周五 17 点发到某个微信联系人。
      微信服务端要求 bot 主动发消息必须带 context_token，
      由对方上一条入站消息提供。所以：
        前置 1：daemon 必须先跑起来一段时间。
        前置 2：那位联系人**先给 bot 发过至少一条消息**，
                daemon 会自动把 token 落盘到
                .agent-slack/wechat/context-tokens.json（per-peer）。
        前置 3：把 target.to 填成那个联系人的 ilink_user_id（形如 'oXXX...@im.wechat'）。
                自己微信账号的 ilink_user_id 可在 .agent-slack/wechat/credentials.json
                的 userId 字段查到（用来推到 bot ↔ 自己的私聊）。
      未命中 store 时 scheduled 路径会抛 MissingContextTokenError，
      history 写 failed，错误信息会提示你去做这件事。
    cron: '0 17 * * 5'
    prompt: |
      生成本周工作小结，3 个 highlight + 下周计划。
    target:
      im: wechat
      to: oREPLACE_WITH_PEER_MICROID@im.wechat
